<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal LIANCI - Secretaria</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --primary-dark: #00332c;
            --primary: #004d40;
            --accent: #b2945d;
            --accent-light: #d4bc8d;
            --bg-light: #f4f7f6;
            --white: #ffffff;
            --text-main: #1a202c;
            --danger: #e53e3e;
            --success: #38a169;
            --warning: #d69e2e;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-main);
            overflow-x: hidden; /* Evita scroll horizontal indesejado */
        }

        /* NAVEGAÇÃO RESPONSIVA */
        nav {
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
            color: var(--white);
            padding: 10px 5%;
            min-height: 80px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 3px solid var(--accent);
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .brand { display: flex; align-items: center; gap: 12px; }
        .brand img {
            height: 50px;
            width: 50px;
            object-fit: contain;
            border: 2px solid var(--accent);
            border-radius: 50%;
            background: var(--white);
        }

        .brand-text h1 { margin: 0; font-family: 'Merriweather', serif; font-size: 1.1rem; letter-spacing: 1px; }

        .nav-links { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; }
        
        .nav-links button {
            background: transparent;
            border: none;
            color: var(--white);
            font-weight: 600;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            font-size: 0.75rem;
        }
        .nav-links button:hover { color: var(--accent-light); background: rgba(255,255,255,0.1); }
        .nav-links button.active { border-bottom: 2px solid var(--accent); color: var(--accent); background: rgba(255,255,255,0.05); }

        /* LAYOUT E MARCA D'ÁGUA */
        .container { 
            max-width: 1200px; 
            margin: 20px auto; 
            padding: 0 15px; 
        }

        .slide-card {
            background: var(--white);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            padding: 25px;
            display: none;
            animation: slideUp 0.4s ease-out;
            min-height: 450px;
            border-top: 6px solid var(--primary);
            position: relative;
            z-index: 1;
        }
        
        /* Marca d'água responsiva */
        .slide-card::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 350px;
            height: 350px;
            background-image: url('logo.jpg');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0.03;
            z-index: -1;
            pointer-events: none;
        }

        .slide-card.active { display: block; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2.section-header {
            font-family: 'Merriweather', serif;
            color: var(--primary);
            font-size: 1.5rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* PAINÉIS E GRIDS RESPONSIVOS */
        .admin-panel {
            background: #fdfaf4;
            border: 1px solid var(--accent);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
        }
        
        .grid-2 { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); 
            gap: 15px; 
        }

        /* TABELAS RESPONSIVAS */
        .table-wrapper { 
            width: 100%;
            overflow-x: auto; 
            margin-top: 15px; 
            border-radius: 8px; 
            border: 1px solid #e2e8f0; 
            background: var(--white); 
            -webkit-overflow-scrolling: touch; /* Scroll suave no iOS */
        }
        
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th { background: var(--primary); color: var(--white); padding: 12px; text-align: left; font-size: 0.85rem; }
        td { padding: 12px; border-bottom: 1px solid #edf2f7; font-size: 0.9rem; }

        /* COMPONENTES */
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 700; }
        .bg-presenca { background: #c6f6d5; color: #22543d; }
        .bg-falta { background: #fed7d7; color: #9b2c2c; }
        .bg-justificada { background: #bee3f8; color: #2b6cb0; }
        .bg-gold { background: #fefcbf; color: #744210; }

        .btn-gold {
            background: var(--accent);
            color: var(--white);
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            width: 100%; /* Botões ocupam largura total no mobile por padrão */
        }
        
        @media (min-width: 768px) {
            .btn-gold { width: auto; }
        }

        .btn-small { padding: 6px 10px; font-size: 0.75rem; margin: 2px; display: inline-block; }

        /* ACORDEON */
        .day-header { background: #f8fafc; padding: 12px 15px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border-radius: 8px; font-size: 0.9rem; }
        .day-content { display: none; padding: 15px; border-top: 1px solid #e2e8f0; font-size: 0.85rem; }
        
        /* MEDIA QUERIES ESPECÍFICAS */
        @media (max-width: 768px) {
            nav { justify-content: center; flex-direction: column; height: auto; gap: 15px; padding: 15px; }
            .brand { flex-direction: column; text-align: center; }
            .container { margin: 10px auto; }
            .slide-card { padding: 20px; }
            h2.section-header { font-size: 1.3rem; }
            .nav-links button { padding: 6px 8px; font-size: 0.7rem; }
            .material-item { flex-direction: column; align-items: flex-start; gap: 10px; }
        }
    </style>
</head>
<body>

<nav>
    <div class="brand">
        <img src="logo.jpg" alt="Logo LIANCI" onerror="this.src='https://via.placeholder.com/60/004d40/b2945d?text=LIANCI'">
        <div class="brand-text">
            <h1>PORTAL LIANCI</h1>
        </div>
    </div>
    <div class="nav-links">
        <button id="nav-freq" class="active" onclick="showSlide('freq')">Frequência</button>
        <button id="nav-atas" onclick="showSlide('atas')">Atas</button>
        <button id="nav-bib" onclick="showSlide('bib')">Biblioteca</button>
        <button id="nav-plantoes" onclick="showSlide('plantoes')">Plantões</button>
        <button id="nav-adm" style="display:none;" onclick="showSlide('adm')">Membros</button>
        <button id="btn-login-main" onclick="toggleLogin()" style="border: 1px solid var(--accent);">Login</button>
    </div>
</nav>

<div class="container">
    
    <section id="slide-freq" class="slide-card active">
        <h2 class="section-header"><i class="fa-solid fa-calendar-check"></i> Frequência</h2>
        
        <div id="panel-chamada" class="admin-panel admin-only" style="display:none;">
            <h3 id="titulo-painel-chamada">Nova Chamada</h3>
            <input type="text" id="aula-tema" placeholder="Tema da Reunião ou Aula">
            <div class="table-wrapper">
                <table>
                    <thead><tr><th>Membro</th><th>Status</th></tr></thead>
                    <tbody id="tbody-chamada-input"></tbody>
                </table>
            </div>
            <div style="margin-top:15px; display:flex; gap:10px; flex-wrap:wrap;">
                <button id="btn-salvar-chamada" class="btn-gold" onclick="salvarAula()">Salvar Chamada</button>
                <button id="btn-cancelar-edicao" class="btn-gold" style="display:none; background: #a0aec0;" onclick="cancelarEdicaoAula()">Cancelar</button>
            </div>
        </div>

        <div style="display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;">
            <button class="btn-gold" onclick="switchFreqView('dias')">Histórico por Dias</button>
            <button class="btn-gold" onclick="switchFreqView('ranking')">Ranking de Presença</button>
        </div>

        <div id="freq-view-dias">
            <div id="lista-dias-container"></div>
        </div>

        <div id="freq-view-ranking" style="display:none;">
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Membro</th>
                            <th>Pres.</th>
                            <th>Just.</th>
                            <th>Faltas</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-ranking"></tbody>
                </table>
            </div>
        </div>
    </section>

    <section id="slide-atas" class="slide-card">
        <h2 class="section-header"><i class="fa-solid fa-file-lines"></i> Atas de Reunião</h2>
        <div class="admin-panel admin-only" style="display:none;">
            <h3>Publicar Ata</h3>
            <div class="grid-2">
                <input type="text" id="ata-titulo" placeholder="Título da Ata">
                <input type="date" id="ata-data">
            </div>
            <input type="text" id="ata-link" placeholder="Link do Google Drive">
            <button class="btn-gold" onclick="salvarAta()">Adicionar</button>
        </div>
        <div id="atas-list"></div>
    </section>

    <section id="slide-bib" class="slide-card">
        <h2 class="section-header"><i class="fa-solid fa-book-medical"></i> Biblioteca</h2>
        <div class="admin-panel admin-only" style="display:none;">
            <h3>Novo Material</h3>
            <div class="grid-2">
                <input type="text" id="bib-titulo" placeholder="Título">
                <input type="text" id="bib-cat" list="cats-bib" placeholder="Protocolos, Artigos ou VideoAulas">
                <datalist id="cats-bib">
                    <option value="Protocolos">
                    <option value="Artigos">
                    <option value="VideoAulas">
                </datalist>
            </div>
            <input type="text" id="bib-link" placeholder="Link de Acesso">
            <button class="btn-gold" onclick="salvarBib()">Publicar</button>
        </div>
        <div id="bib-list"></div>
    </section>

    <section id="slide-plantoes" class="slide-card">
        <h2 class="section-header"><i class="fa-solid fa-user-doctor"></i> Plantões</h2>
        <div class="admin-panel admin-only" style="display:none;">
            <h3>Registrar Plantão</h3>
            <div class="grid-2">
                <select id="p-membro"><option value="">Membro...</option></select>
                <input type="month" id="p-mes">
            </div>
            <input type="number" id="p-qtd" placeholder="Quantidade de Plantões">
            <button class="btn-gold" onclick="salvarPlantao()">Salvar</button>
        </div>
        <div id="plantoes-list"></div>
    </section>

    <section id="slide-adm" class="slide-card">
        <h2 class="section-header"><i class="fa-solid fa-users"></i> Gestão de Membros</h2>
        <div id="panel-membro" class="admin-panel">
            <h3 id="titulo-painel-membro">Cadastro / Edição</h3>
            <div class="grid-2">
                <input type="text" id="m-nome" placeholder="Nome Completo">
                <input type="text" id="m-mat" placeholder="Matrícula">
                <input type="text" id="m-sem" placeholder="Semestre (ex: 5º)">
                <select id="m-mod">
                    <option value="Estágio + Liga">Estágio + Liga</option>
                    <option value="Só Liga">Só Liga</option>
                </select>
            </div>
            <div style="margin-top:10px; display:flex; gap:10px;">
                <button id="btn-salvar-membro" class="btn-gold" onclick="salvarFormularioMembro()">Salvar Membro</button>
                <button id="btn-cancelar-membro" class="btn-gold" style="display:none; background: #a0aec0;" onclick="cancelarEdicaoMembro()">Cancelar</button>
            </div>
        </div>
        <div class="table-wrapper">
            <table>
                <thead><tr><th>Nome</th><th>Matrícula</th><th>Semestre</th><th>Modalidade</th><th>Ações</th></tr></thead>
                <tbody id="tbody-membros-list"></tbody>
            </table>
        </div>
    </section>

</div>

<script>
    // --- FIREBASE CONFIG (SEUS DADOS) ---
    const firebaseConfig = {
        apiKey: "AIzaSyA2ef4mY9sm-cVPkAq0bwzBjsgmRLN2_jQ",
        authDomain: "portal-liga-de-cirurgia.firebaseapp.com",
        databaseURL: "https://portal-liga-de-cirurgia-default-rtdb.firebaseio.com",
        projectId: "portal-liga-de-cirurgia",
        messagingSenderId: "408679438531",
        appId: "1:408679438531:web:46667abc7bcdd9b9d2ea76"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let idAulaEditando = null;
    let idMembroEditando = null;

    // --- NAVEGAÇÃO ---
    function showSlide(id) {
        document.querySelectorAll('.slide-card').forEach(s => s.classList.remove('active'));
        document.getElementById('slide-' + id).classList.add('active');
        document.querySelectorAll('.nav-links button').forEach(b => b.classList.remove('active'));
        document.getElementById('nav-' + id).classList.add('active');
        
        if(id === 'freq') carregarDadosFrequencia();
        if(id === 'atas') carregarAtas();
        if(id === 'bib') carregarBiblioteca();
        if(id === 'plantoes') carregarPlantoes();
        if(id === 'adm') carregarMembrosAdmin();
    }

    function switchFreqView(view) {
        document.getElementById('freq-view-ranking').style.display = view === 'ranking' ? 'block' : 'none';
        document.getElementById('freq-view-dias').style.display = view === 'dias' ? 'block' : 'none';
    }

    // --- AUTH ---
    auth.onAuthStateChanged(user => {
        const btn = document.getElementById('btn-login-main');
        const adminElements = document.querySelectorAll('.admin-only');
        const navAdm = document.getElementById('nav-adm');
        if(user) {
            btn.innerText = "Sair";
            navAdm.style.display = "block";
            adminElements.forEach(el => el.style.display = "block");
            carregarDadosFrequencia();
        } else {
            btn.innerText = "Acesso Sec.";
            navAdm.style.display = "none";
            adminElements.forEach(el => el.style.display = "none");
            carregarDadosFrequencia();
        }
    });

    function toggleLogin() {
        if(auth.currentUser) auth.signOut();
        else {
            const email = prompt("E-mail Secretaria:");
            const pass = prompt("Senha:");
            if(email && pass) auth.signInWithEmailAndPassword(email, pass).catch(e => alert("Erro ao logar."));
        }
    }

    // --- FREQUÊNCIA ---
    async function carregarDadosFrequencia() {
        const rankingBody = document.getElementById('tbody-ranking');
        const diasContainer = document.getElementById('lista-dias-container');
        const inputChamada = document.getElementById('tbody-chamada-input');
        
        const membrosSnap = await db.collection("membros").orderBy("nome").get();
        const aulasSnap = await db.collection("aulas").orderBy("timestamp", "desc").get();

        inputChamada.innerHTML = '';
        membrosSnap.forEach(doc => {
            inputChamada.innerHTML += `<tr><td>${doc.data().nome}</td><td>
                <select class="status-input" data-id="${doc.id}" style="padding:5px;">
                    <option value="P">Pres.</option><option value="F">Falta</option><option value="J">Just.</option>
                </select>
            </td></tr>`;
        });

        let ranking = [];
        membrosSnap.forEach(doc => {
            let p=0, j=0, f=0;
            aulasSnap.forEach(aDoc => {
                const a = aDoc.data();
                if(a.presentes?.includes(doc.id)) p++;
                else if(a.justificadas?.includes(doc.id)) j++;
                else f++;
            });
            ranking.push({nome: doc.data().nome, p, j, f});
        });
        ranking.sort((a,b) => b.f - a.f);
        rankingBody.innerHTML = ranking.map(r => `<tr><td><strong>${r.nome}</strong></td><td><span class="badge bg-presenca">${r.p}</span></td><td><span class="badge bg-justificada">${r.j}</span></td><td><span class="badge bg-falta">${r.f}</span></td></tr>`).join('');

        diasContainer.innerHTML = '';
        aulasSnap.forEach(doc => {
            const a = doc.data();
            const aulaId = doc.id;
            let botoes = auth.currentUser ? `<div><button class="btn-edit btn-small" onclick="iniciarEdicaoAula('${aulaId}', '${a.tema}')">Editar</button><button class="btn-danger btn-small" onclick="excluirAula('${aulaId}')">X</button></div>` : '';
            
            diasContainer.innerHTML += `
                <div class="day-item" id="aula-item-${aulaId}" data-pres='${JSON.stringify(a.presentes || [])}' data-just='${JSON.stringify(a.justificadas || [])}'>
                    <div class="day-header" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'block' ? 'none' : 'block'">
                        <span>📅 ${a.dataCadastro} - <strong>${a.tema}</strong></span>
                        <div style="display:flex; align-items:center; gap:10px;">${botoes} <i class="fa-solid fa-chevron-down"></i></div>
                    </div>
                    <div class="day-content">
                        <p><strong>Presentes:</strong> ${membrosSnap.docs.filter(m => a.presentes?.includes(m.id)).map(m => m.data().nome).join(', ') || 'Ninguém'}</p>
                        <p><strong>Justificadas:</strong> ${membrosSnap.docs.filter(m => a.justificadas?.includes(m.id)).map(m => m.data().nome).join(', ') || 'Nenhuma'}</p>
                    </div>
                </div>`;
        });
    }

    async function salvarAula() {
        const tema = document.getElementById('aula-tema').value;
        if(!tema) return alert("Digite o tema!");
        const inputs = document.querySelectorAll('.status-input');
        let presentes = [], justificadas = [];
        inputs.forEach(i => {
            if(i.value === 'P') presentes.push(i.dataset.id);
            if(i.value === 'J') justificadas.push(i.dataset.id);
        });
        if(idAulaEditando) await db.collection("aulas").doc(idAulaEditando).update({ tema, presentes, justificadas });
        else await db.collection("aulas").add({ tema, presentes, justificadas, dataCadastro: new Date().toLocaleDateString(), timestamp: firebase.firestore.FieldValue.serverTimestamp() });
        alert("Chamada Registrada!"); cancelarEdicaoAula(); carregarDadosFrequencia();
    }

    function iniciarEdicaoAula(id, tema) {
        idAulaEditando = id;
        const div = document.getElementById(`aula-item-${id}`);
        const p = JSON.parse(div.dataset.pres);
        const j = JSON.parse(div.dataset.just);
        document.getElementById('aula-tema').value = tema;
        document.getElementById('titulo-painel-chamada').innerText = "Editando Chamada";
        document.getElementById('btn-cancelar-edicao').style.display = "block";
        document.querySelectorAll('.status-input').forEach(i => {
            if(p.includes(i.dataset.id)) i.value = 'P';
            else if(j.includes(i.dataset.id)) i.value = 'J';
            else i.value = 'F';
        });
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelarEdicaoAula() { idAulaEditando = null; document.getElementById('aula-tema').value = ""; document.getElementById('btn-cancelar-edicao').style.display = "none"; document.getElementById('titulo-painel-chamada').innerText = "Nova Chamada"; }
    async function excluirAula(id) { if(confirm("Excluir chamada?")) { await db.collection("aulas").doc(id).delete(); carregarDadosFrequencia(); } }

    // --- ATAS / BIBLIOTECA ---
    async function salvarAta() {
        const titulo = document.getElementById('ata-titulo').value;
        const data = document.getElementById('ata-data').value.split('-').reverse().join('/');
        const url = document.getElementById('ata-link').value;
        await db.collection("atas").add({ titulo, url, data, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
        alert("Ata Salva!"); carregarAtas();
    }
    function carregarAtas() {
        db.collection("atas").orderBy("timestamp", "desc").get().then(snap => {
            document.getElementById('atas-list').innerHTML = snap.docs.map(doc => `<div class="material-item"><span><strong>${doc.data().data}</strong> - ${doc.data().titulo}</span><a href="${doc.data().url}" target="_blank" class="btn-gold">Abrir</a></div>`).join('');
        });
    }

    async function salvarBib() {
        const titulo = document.getElementById('bib-titulo').value;
        const categoria = document.getElementById('bib-cat').value;
        const url = document.getElementById('bib-link').value;
        await db.collection("biblioteca").add({ titulo, categoria, url, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
        alert("Salvo!"); carregarBiblioteca();
    }
    function carregarBiblioteca() {
        db.collection("biblioteca").get().then(snap => {
            const groups = {};
            snap.forEach(doc => {
                const b = doc.data();
                if(!groups[b.categoria]) groups[b.categoria] = [];
                groups[b.categoria].push(b);
            });
            document.getElementById('bib-list').innerHTML = Object.keys(groups).map(cat => `<div class="category-block"><h3>📁 ${cat}</h3>` + groups[cat].map(i => `<div class="material-item"><span>${i.titulo}</span><a href="${i.url}" target="_blank" class="btn-gold">Link</a></div>`).join('') + `</div>`).join('');
        });
    }

    // --- PLANTÕES ---
    async function salvarPlantao() {
        const mSelect = document.getElementById('p-membro');
        const mesInput = document.getElementById('p-mes').value;
        const qtd = document.getElementById('p-qtd').value;
        await db.collection("plantoes").add({ membroNome: mSelect.options[mSelect.selectedIndex].text, mesReferencia: mesInput, quantidade: qtd, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
        alert("Plantão Salvo!"); carregarPlantoes();
    }
    function carregarPlantoes() {
        db.collection("membros").orderBy("nome").get().then(snap => {
            document.getElementById('p-membro').innerHTML = snap.docs.map(doc => `<option value="${doc.id}">${doc.data().nome}</option>`).join('');
        });
        db.collection("plantoes").orderBy("mesReferencia", "desc").get().then(snap => {
            document.getElementById('plantoes-list').innerHTML = snap.docs.map(doc => `<div class="material-item"><span><strong>${doc.data().membroNome}</strong> (${doc.data().mesReferencia})</span><span class="badge bg-presenca">${doc.data().quantidade} plantões</span></div>`).join('');
        });
    }

    // --- GESTÃO DE MEMBROS ---
    async function salvarFormularioMembro() {
        const nome = document.getElementById('m-nome').value, mat = document.getElementById('m-mat').value, sem = document.getElementById('m-sem').value, mod = document.getElementById('m-mod').value;
        if(idMembroEditando) await db.collection("membros").doc(idMembroEditando).update({ nome, matricula: mat, semestre: sem, modalidade: mod });
        else await db.collection("membros").add({ nome, matricula: mat, semestre: sem, modalidade: mod });
        alert("OK!"); cancelarEdicaoMembro(); carregarMembrosAdmin();
    }
    function iniciarEdicaoMembro(id, n, m, s, mo) { idMembroEditando = id; document.getElementById('m-nome').value = n; document.getElementById('m-mat').value = m; document.getElementById('m-sem').value = s; document.getElementById('m-mod').value = mo; document.getElementById('btn-cancelar-membro').style.display = "block"; window.scrollTo({ top: 0, behavior: 'smooth' }); }
    function cancelarEdicaoMembro() { idMembroEditando = null; document.getElementById('btn-cancelar-membro').style.display = "none"; document.querySelectorAll('#panel-membro input').forEach(i => i.value = ""); }
    function carregarMembrosAdmin() {
        db.collection("membros").orderBy("nome").get().then(snap => {
            document.getElementById('tbody-membros-list').innerHTML = snap.docs.map(doc => {
                const m = doc.data();
                return `<tr><td>${m.nome}</td><td>${m.matricula}</td><td>${m.semestre}</td><td>${m.modalidade}</td><td><button class="btn-edit btn-small" onclick="iniciarEdicaoMembro('${doc.id}','${m.nome}','${m.matricula}','${m.semestre}','${m.modalidade}')">Edit</button></td></tr>`;
            }).join('');
        });
    }

    window.onload = () => showSlide('freq');
</script>
</body>
</html>
