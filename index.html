
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIANCI - Portal da Secretaria</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --primary-dark: #00332c;
            --primary: #004d40;
            --accent: #b2945d;
            --accent-light: #d4bc8d;
            --bg-light: #f4f7f6;
            --white: #ffffff;
            --text-main: #1a202c;
            --danger: #e53e3e;
            --success: #38a169;
            --warning: #ed8936;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-main);
        }

        nav {
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
            color: var(--white);
            padding: 0 5%;
            height: 80px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 3px solid var(--accent);
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .brand { display: flex; align-items: center; gap: 15px; }
        .brand-text h1 { margin: 0; font-family: 'Merriweather', serif; font-size: 1.2rem; letter-spacing: 1px; }

        .nav-links { display: flex; gap: 10px; }
        .nav-links button {
            background: transparent;
            border: none;
            color: var(--white);
            font-weight: 600;
            padding: 10px 18px;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            font-size: 0.85rem;
        }
        .nav-links button:hover { color: var(--accent-light); }
        .nav-links button.active { border-bottom: 2px solid var(--accent); color: var(--accent); }

        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }

        .slide-card {
            background: var(--white);
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            padding: 40px;
            display: none;
            animation: slideUp 0.5s ease-out;
            min-height: 500px;
            border-top: 5px solid var(--primary);
        }
        .slide-card.active { display: block; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2.section-header {
            font-family: 'Merriweather', serif;
            color: var(--primary);
            font-size: 1.8rem;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .admin-panel {
            background: #fdfaf4;
            border: 1px solid var(--accent);
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .table-wrapper { overflow-x: auto; margin-top: 20px; border-radius: 8px; border: 1px solid #e2e8f0; }
        table { width: 100%; border-collapse: collapse; }
        th { background: var(--primary); color: var(--white); padding: 12px; text-align: left; font-size: 0.85rem; }
        td { padding: 12px; border-bottom: 1px solid #edf2f7; }

        .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
        .bg-presenca { background: #c6f6d5; color: #22543d; }
        .bg-falta { background: #fed7d7; color: #9b2c2c; }
        .bg-justificada { background: #bee3f8; color: #2b6cb0; }

        .btn-gold {
            background: var(--accent);
            color: var(--white);
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-gold:hover { background: var(--primary-dark); }

        .day-item { border: 1px solid #e2e8f0; margin-bottom: 10px; border-radius: 8px; }
        .day-header { background: #f8fafc; padding: 15px; cursor: pointer; display: flex; justify-content: space-between; font-weight: 600; }
        .day-content { display: none; padding: 20px; border-top: 1px solid #e2e8f0; }

        .view-toggle { display: flex; gap: 10px; margin-bottom: 20px; }
    </style>
</head>
<body>

<nav>
    <div class="brand">
        <div class="brand-text">
            <h1>PORTAL LIANCI</h1>
            <small style="color: var(--accent-light);">Secretaria Acadêmica</small>
        </div>
    </div>
    <div class="nav-links">
        <button id="nav-freq" class="active" onclick="showSlide('freq')">Frequência</button>
        <button id="nav-atas" onclick="showSlide('atas')">Atas</button>
        <button id="nav-bib" onclick="showSlide('bib')">Biblioteca</button>
        <button id="nav-adm" style="display:none;" onclick="showSlide('adm')">Membros</button>
        <button id="btn-login-main" onclick="toggleLogin()" style="background: var(--accent); color: white;">Login Sec.</button>
    </div>
</nav>

<div class="container">
    
    <!-- FREQUENCIA -->
    <section id="slide-freq" class="slide-card active">
        <h2 class="section-header"><i class="fa-solid fa-calendar-check"></i> Frequência</h2>
        
        <div class="admin-panel admin-only" style="display:none;">
            <h3>Nova Chamada</h3>
            <input type="text" id="aula-tema" placeholder="Tema da Aula" style="width:100%; padding:10px; margin-bottom:15px;">
            <div class="table-wrapper">
                <table>
                    <thead><tr><th>Membro</th><th>Status</th></tr></thead>
                    <tbody id="tbody-chamada-input"></tbody>
                </table>
            </div>
            <button class="btn-gold" style="margin-top:15px;" onclick="salvarAula()">Salvar Chamada</button>
        </div>

        <div class="view-toggle">
            <button class="btn-gold" onclick="switchFreqView('ranking')">Ranking de Faltas</button>
            <button class="btn-gold" onclick="switchFreqView('dias')">Histórico por Dias</button>
        </div>

        <div id="freq-view-ranking">
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Membro</th>
                            <th>Presenças</th>
                            <th>Justificadas</th>
                            <th>Faltas</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-ranking"></tbody>
                </table>
            </div>
        </div>

        <div id="freq-view-dias" style="display:none;">
            <div id="lista-dias-container"></div>
        </div>
    </section>

    <!-- ATAS -->
    <section id="slide-atas" class="slide-card">
        <h2 class="section-header"><i class="fa-solid fa-file-lines"></i> Atas de Reunião</h2>
        <div class="admin-panel admin-only" style="display:none;">
            <h3>Publicar Ata</h3>
            <input type="text" id="ata-titulo" placeholder="Título da Ata" style="width:100%; padding:10px; margin-bottom:10px;">
            <input type="text" id="ata-link" placeholder="Link do Arquivo (Drive)" style="width:100%; padding:10px; margin-bottom:10px;">
            <button class="btn-gold" onclick="salvarAta()">Adicionar</button>
        </div>
        <div id="atas-list"></div>
    </section>

    <!-- BIBLIOTECA -->
    <section id="slide-bib" class="slide-card">
        <h2 class="section-header"><i class="fa-solid fa-book"></i> Biblioteca</h2>
        <div class="admin-panel admin-only" style="display:none;">
            <h3>Novo Material</h3>
            <input type="text" id="bib-titulo" placeholder="Título" style="width:100%; padding:10px; margin-bottom:10px;">
            <input type="text" id="bib-cat" placeholder="Categoria" style="width:100%; padding:10px; margin-bottom:10px;">
            <input type="text" id="bib-link" placeholder="Link" style="width:100%; padding:10px; margin-bottom:10px;">
            <button class="btn-gold" onclick="salvarBib()">Salvar</button>
        </div>
        <div id="bib-list"></div>
    </section>

    <!-- MEMBROS (ADMIN) -->
    <section id="slide-adm" class="slide-card">
        <h2 class="section-header"><i class="fa-solid fa-users"></i> Gestão de Membros</h2>
        <div class="admin-panel">
            <h3>Cadastrar Membro</h3>
            <input type="text" id="m-nome" placeholder="Nome" style="width:100%; padding:10px; margin-bottom:10px;">
            <input type="text" id="m-mat" placeholder="Matrícula" style="width:100%; padding:10px; margin-bottom:10px;">
            <button class="btn-gold" onclick="cadastrarMembro()">Cadastrar</button>
        </div>
        <div class="table-wrapper">
            <table>
                <thead><tr><th>Nome</th><th>Matrícula</th><th>Ação</th></tr></thead>
                <tbody id="tbody-membros-list"></tbody>
            </table>
        </div>
    </section>

</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyA2ef4mY9sm-cVPkAq0bwzBjsgmRLN2_jQ",
        authDomain: "portal-liga-de-cirurgia.firebaseapp.com",
        databaseURL: "https://portal-liga-de-cirurgia-default-rtdb.firebaseio.com",
        projectId: "portal-liga-de-cirurgia",
        storageBucket: "portal-liga-de-cirurgia.firebasestorage.app",
        messagingSenderId: "408679438531",
        appId: "1:408679438531:web:46667abc7bcdd9b9d2ea76"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    function showSlide(id) {
        document.querySelectorAll('.slide-card').forEach(s => s.classList.remove('active'));
        document.getElementById('slide-' + id).classList.add('active');
        document.querySelectorAll('.nav-links button').forEach(b => b.classList.remove('active'));
        document.getElementById('nav-' + (id==='freq'?'freq':id==='atas'?'atas':id==='bib'?'bib':'adm')).classList.add('active');
        
        if(id === 'freq') carregarDadosFrequencia();
        if(id === 'atas') carregarAtas();
        if(id === 'bib') carregarBiblioteca();
        if(id === 'adm') carregarMembros();
    }

    function switchFreqView(view) {
        document.getElementById('freq-view-ranking').style.display = view === 'ranking' ? 'block' : 'none';
        document.getElementById('freq-view-dias').style.display = view === 'dias' ? 'block' : 'none';
    }

    auth.onAuthStateChanged(user => {
        const btn = document.getElementById('btn-login-main');
        const adminElements = document.querySelectorAll('.admin-only');
        const navAdm = document.getElementById('nav-adm');
        if(user) {
            btn.innerText = "Sair";
            navAdm.style.display = "block";
            adminElements.forEach(el => el.style.display = "block");
        } else {
            btn.innerText = "Login Sec.";
            navAdm.style.display = "none";
            adminElements.forEach(el => el.style.display = "none");
        }
    });

    function toggleLogin() {
        if(auth.currentUser) auth.signOut();
        else {
            const email = prompt("E-mail:");
            const pass = prompt("Senha:");
            if(email && pass) auth.signInWithEmailAndPassword(email, pass).catch(e => alert(e.message));
        }
    }

    async function carregarDadosFrequencia() {
        const rankingBody = document.getElementById('tbody-ranking');
        const diasContainer = document.getElementById('lista-dias-container');
        const inputChamada = document.getElementById('tbody-chamada-input');
        
        const membrosSnap = await db.collection("membros").orderBy("nome").get();
        const aulasSnap = await db.collection("aulas").orderBy("timestamp", "desc").get();

        inputChamada.innerHTML = '';
        membrosSnap.forEach(doc => {
            inputChamada.innerHTML += `<tr><td>${doc.data().nome}</td><td>
                <select class="status-input" data-id="${doc.id}">
                    <option value="P">Presente</option><option value="F">Falta</option><option value="J">Justificada</option>
                </select>
            </td></tr>`;
        });

        let ranking = [];
        membrosSnap.forEach(doc => {
            let p=0, j=0, f=0;
            aulasSnap.forEach(aDoc => {
                const a = aDoc.data();
                if(a.presentes?.includes(doc.id)) p++;
                else if(a.justificadas?.includes(doc.id)) j++;
                else f++;
            });
            ranking.push({nome: doc.data().nome, p, j, f});
        });
        ranking.sort((a,b) => b.f - a.f);
        rankingBody.innerHTML = ranking.map(r => `<tr><td>${r.nome}</td><td><span class="badge bg-presenca">${r.p}</span></td><td><span class="badge bg-justificada">${r.j}</span></td><td><span class="badge bg-falta">${r.f}</span></td></tr>`).join('');

        diasContainer.innerHTML = '';
        aulasSnap.forEach(doc => {
            const a = doc.data();
            diasContainer.innerHTML += `
                <div class="day-item">
                    <div class="day-header" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'block' ? 'none' : 'block'">
                        <span>📅 ${a.dataCadastro} - ${a.tema}</span><i class="fa-solid fa-chevron-down"></i>
                    </div>
                    <div class="day-content">
                        <p><strong>Presentes:</strong> ${membrosSnap.docs.filter(m => a.presentes?.includes(m.id)).map(m => m.data().nome).join(', ') || 'Nenhum'}</p>
                        <p><strong>Faltas:</strong> ${membrosSnap.docs.filter(m => !a.presentes?.includes(m.id) && !a.justificadas?.includes(m.id)).map(m => m.data().nome).join(', ') || 'Nenhuma'}</p>
                    </div>
                </div>`;
        });
    }

    async function salvarAula() {
        const tema = document.getElementById('aula-tema').value;
        const inputs = document.querySelectorAll('.status-input');
        let presentes = [], justificadas = [];
        inputs.forEach(i => {
            if(i.value === 'P') presentes.push(i.dataset.id);
            if(i.value === 'J') justificadas.push(i.dataset.id);
        });
        await db.collection("aulas").add({ tema, presentes, justificadas, dataCadastro: new Date().toLocaleDateString(), timestamp: firebase.firestore.FieldValue.serverTimestamp() });
        alert("Salvo!"); carregarDadosFrequencia();
    }

    async function salvarAta() {
        const titulo = document.getElementById('ata-titulo').value;
        const url = document.getElementById('ata-link').value;
        await db.collection("atas").add({ titulo, url, data: new Date().toLocaleDateString(), timestamp: firebase.firestore.FieldValue.serverTimestamp() });
        carregarAtas();
    }

    function carregarAtas() {
        db.collection("atas").orderBy("timestamp", "desc").get().then(snap => {
            document.getElementById('atas-list').innerHTML = snap.docs.map(doc => `<div class="material-item"><span>${doc.data().data} - ${doc.data().titulo}</span><a href="${doc.data().url}" target="_blank" class="btn-gold">Ver</a></div>`).join('');
        });
    }

    async function salvarBib() {
        const titulo = document.getElementById('bib-titulo').value;
        const categoria = document.getElementById('bib-cat').value;
        const url = document.getElementById('bib-link').value;
        await db.collection("biblioteca").add({ titulo, categoria, url, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
        carregarBiblioteca();
    }

    function carregarBiblioteca() {
        db.collection("biblioteca").get().then(snap => {
            const groups = {};
            snap.forEach(doc => {
                const b = doc.data();
                if(!groups[b.categoria]) groups[b.categoria] = [];
                groups[b.categoria].push(b);
            });
            document.getElementById('bib-list').innerHTML = Object.keys(groups).map(cat => `<div class="category-block"><h3>📁 ${cat}</h3>` + groups[cat].map(i => `<div class="material-item"><a href="${i.url}" target="_blank">${i.titulo}</a></div>`).join('') + `</div>`).join('');
        });
    }

    async function cadastrarMembro() {
        const nome = document.getElementById('m-nome').value;
        const matricula = document.getElementById('m-mat').value;
        await db.collection("membros").add({ nome, matricula });
        carregarMembros();
    }

    function carregarMembros() {
        db.collection("membros").orderBy("nome").get().then(snap => {
            document.getElementById('tbody-membros-list').innerHTML = snap.docs.map(doc => `<tr><td>${doc.data().nome}</td><td>${doc.data().matricula}</td><td><button class="btn-danger" onclick="excluirMembro('${doc.id}')">Excluir</button></td></tr>`).join('');
        });
    }

    async function excluirMembro(id) { if(confirm("Excluir?")) { await db.collection("membros").doc(id).delete(); carregarMembros(); } }

    window.onload = () => showSlide('freq');
</script>
</body>
</html>
