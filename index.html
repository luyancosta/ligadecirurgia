<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIANCI - Portal da Secretaria</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --primary-dark: #00332c;
            --primary: #004d40;
            --accent: #b2945d;
            --accent-light: #d4bc8d;
            --bg-light: #f4f7f6;
            --white: #ffffff;
            --text-main: #1a202c;
            --danger: #e53e3e;
            --success: #38a169;
            --warning: #d69e2e;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-main);
        }

        nav {
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
            color: var(--white);
            padding: 10px 5%;
            min-height: 80px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 3px solid var(--accent);
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .brand { display: flex; align-items: center; gap: 12px; }
        .brand img { height: 50px; width: 50px; border: 2px solid var(--accent); border-radius: 50%; background: white; object-fit: contain; }
        .brand-text h1 { margin: 0; font-family: 'Merriweather', serif; font-size: 1.1rem; }

        .nav-links { display: flex; gap: 5px; flex-wrap: wrap; }
        .nav-links button {
            background: transparent; border: none; color: var(--white); font-weight: 600;
            padding: 8px 12px; border-radius: 4px; cursor: pointer; transition: 0.3s;
            text-transform: uppercase; font-size: 0.75rem;
        }
        .nav-links button.active { border-bottom: 2px solid var(--accent); color: var(--accent); background: rgba(255,255,255,0.05); }

        .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; }

        .slide-card {
            background: var(--white); border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            padding: 25px; display: none; animation: slideUp 0.4s ease-out; min-height: 450px;
            border-top: 6px solid var(--primary); position: relative; z-index: 1; overflow: hidden;
        }
        
        .slide-card::before {
            content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80%; max-width: 400px; height: 400px; background-image: url('logo.jpg');
            background-size: contain; background-repeat: no-repeat; background-position: center;
            opacity: 0.03; z-index: -1; pointer-events: none;
        }

        .slide-card.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        h2.section-header { font-family: 'Merriweather', serif; color: var(--primary); font-size: 1.5rem; margin-bottom: 25px; display: flex; align-items: center; gap: 10px; }

        .admin-panel { background: #fdfaf4; border: 1px solid var(--accent); padding: 20px; border-radius: 10px; margin-bottom: 25px; }
        .grid-inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 15px; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e0; border-radius: 6px; font-family: inherit; }

        .table-wrapper { width: 100%; overflow-x: auto; margin-top: 15px; border-radius: 8px; border: 1px solid #e2e8f0; background: var(--white); -webkit-overflow-scrolling: touch;}
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th { background: var(--primary); color: var(--white); padding: 12px; text-align: left; font-size: 0.85rem; }
        td { padding: 12px; border-bottom: 1px solid #edf2f7; font-size: 0.9rem; }

        .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 700; display: inline-block;}
        .bg-presenca { background: #c6f6d5; color: #22543d; }
        .bg-falta { background: #fed7d7; color: #9b2c2c; }
        .bg-justificada { background: #fefcbf; color: #744210; }

        .btn-gold { background: var(--accent); color: white; border: none; padding: 12px 20px; border-radius: 6px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .btn-gold:hover { background: var(--primary-dark); }
        .btn-small { padding: 8px 12px; font-size: 0.8rem; display: inline-flex; align-items: center; gap: 5px;}
        .btn-danger { background: var(--danger); color: white; border: none; border-radius: 4px; cursor: pointer; }

        .day-header { background: #f8fafc; padding: 15px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border-radius: 8px; margin-bottom: 5px; border: 1px solid #e2e8f0; }
        .day-content { display: none; padding: 15px; background: white; border: 1px solid #e2e8f0; border-top: none; margin-bottom: 10px; border-radius: 0 0 8px 8px; }
        
        /* NOVO LAYOUT PARA ATAS, BIBLIOTECA E PLANTÕES */
        .category-block { margin-bottom: 30px; }
        .category-block h3 { color: var(--primary); border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; margin-bottom: 15px;}
        
        .material-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 15px; 
            border: 1px solid #e2e8f0; 
            border-radius: 8px;
            background: var(--white);
            margin-bottom: 10px;
            gap: 15px;
            transition: 0.2s;
        }
        .material-item:hover { border-color: var(--accent); box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        
        .material-info { display: flex; flex-direction: column; gap: 5px; }
        .material-info strong { color: var(--primary-dark); font-size: 1.05rem; }
        
        .material-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }

        .edit-mode-bg { background-color: #fffaf0 !important; border-color: var(--warning) !important;}

        /* MEDIA QUERIES PARA MOBILE */
        @media (max-width: 768px) {
            nav { flex-direction: column; padding: 15px; gap: 15px; }
            .container { padding: 0 10px; }
            .slide-card { padding: 15px; }
            
            /* Ajuste perfeito para listas encavaladas no mobile */
            .material-item { flex-direction: column; align-items: flex-start; }
            .material-actions { width: 100%; justify-content: flex-end; margin-top: 5px; border-top: 1px dashed #edf2f7; padding-top: 10px;}
            
            .admin-panel .btn-gold { width: 100%; }
        }
    </style>
</head>
<body>

<nav>
    <div class="brand">
        <img src="logo.jpg" alt="Logo LIANCI" onerror="this.src='https://via.placeholder.com/50/004d40/b2945d?text=LC'">
        <div class="brand-text"><h1>PORTAL LIANCI</h1></div>
    </div>
    <div class="nav-links">
        <button id="nav-freq" class="active" onclick="showSlide('freq')">Frequência</button>
        <button id="nav-atas" onclick="showSlide('atas')">Atas</button>
        <button id="nav-bib" onclick="showSlide('bib')">Biblioteca</button>
        <button id="nav-plantoes" onclick="showSlide('plantoes')">Plantões</button>
        <button id="nav-adm" style="display:none;" onclick="showSlide('adm')">Membros</button>
        <button id="btn-login-main" onclick="toggleLogin()" style="border: 1px solid var(--accent);">Login</button>
    </div>
</nav>

<div class="container">
    
    <section id="slide-freq" class="slide-card active">
        <h2 class="section-header"><i class="fa-solid fa-calendar-check"></i> Frequência</h2>
        
        <div id="panel-chamada" class="admin-panel admin-only" style="display:none;">
            <h3 id="titulo-painel-chamada">Registrar Chamada</h3>
            <div class="grid-inputs">
                <input type="text" id="aula-tema" placeholder="Tema da Aula">
                <input type="date" id="aula-data">
                <input type="time" id="aula-hora">
            </div>
            <div class="table-wrapper">
                <table>
                    <thead><tr><th>Membro</th><th>Status</th></tr></thead>
                    <tbody id="tbody-chamada-input"></tbody>
                </table>
            </div>
            <div style="margin-top:15px; display:flex; gap:10px; flex-wrap:wrap;">
                <button id="btn-salvar-chamada" class="btn-gold" onclick="salvarAula()">Salvar Chamada</button>
                <button id="btn-cancelar-edicao" class="btn-gold" style="display:none; background: #a0aec0;" onclick="cancelarEdicaoAula()">Cancelar</button>
            </div>
        </div>

        <div style="display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;">
            <button class="btn-gold" style="width:auto;" onclick="switchFreqView('dias')">Histórico por Dias</button>
            <button class="btn-gold" style="width:auto;" onclick="switchFreqView('ranking')">Ranking de Presença</button>
        </div>

        <div id="freq-view-dias">
            <div id="lista-dias-container"></div>
        </div>

        <div id="freq-view-ranking" style="display:none;">
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Membro</th>
                            <th>Presenças</th>
                            <th>Justificadas</th>
                            <th>Faltas</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-ranking"></tbody>
                </table>
            </div>
        </div>
    </section>

    <section id="slide-atas" class="slide-card">
        <h2 class="section-header"><i class="fa-solid fa-file-lines"></i> Atas de Reunião</h2>
        <div class="admin-panel admin-only" style="display:none;">
            <h3>Publicar Ata</h3>
            <div class="grid-inputs">
                <input type="text" id="ata-titulo" placeholder="Título da Ata">
                <input type="date" id="ata-data">
            </div>
            <input type="text" id="ata-link" placeholder="Link do Google Drive">
            <button class="btn-gold" style="margin-top:10px;" onclick="salvarAta()">Salvar Ata</button>
        </div>
        <div id="atas-list"></div>
    </section>

    <section id="slide-bib" class="slide-card">
        <h2 class="section-header"><i class="fa-solid fa-book"></i> Biblioteca</h2>
        <div class="admin-panel admin-only" style="display:none;">
            <h3>Novo Material</h3>
            <div class="grid-inputs">
                <input type="text" id="bib-titulo" placeholder="Título">
                <select id="bib-cat">
                    <option value="Protocolos">Protocolos</option>
                    <option value="Artigos">Artigos</option>
                    <option value="VideoAulas">VideoAulas</option>
                </select>
                <input type="text" id="bib-link" placeholder="Link (Drive/YouTube)">
            </div>
            <button class="btn-gold" onclick="salvarBib()">Salvar</button>
        </div>
        <div id="bib-list"></div>
    </section>

    <section id="slide-plantoes" class="slide-card">
        <h2 class="section-header"><i class="fa-solid fa-user-doctor"></i> Plantões</h2>
        <div class="admin-panel admin-only" style="display:none;">
            <h3>Registrar Plantão</h3>
            <div class="grid-inputs">
                <select id="p-membro"><option value="">Membro...</option></select>
                <input type="month" id="p-mes">
                <input type="number" id="p-qtd" placeholder="Quantidade">
            </div>
            <button class="btn-gold" onclick="salvarPlantao()">Salvar</button>
        </div>
        <div id="plantoes-list"></div>
    </section>

    <section id="slide-adm" class="slide-card">
        <h2 class="section-header"><i class="fa-solid fa-users"></i> Gestão de Membros</h2>
        <div id="panel-membro" class="admin-panel">
            <h3 id="titulo-painel-membro">Cadastro / Edição</h3>
            <div class="grid-inputs">
                <input type="text" id="m-nome" placeholder="Nome Completo">
                <input type="text" id="m-mat" placeholder="Matrícula">
                <input type="text" id="m-sem" placeholder="Semestre (ex: 5º)">
                <select id="m-mod">
                    <option value="Estágio + Liga">Estágio + Liga</option>
                    <option value="Só Liga">Só Liga</option>
                </select>
            </div>
            <div style="display:flex; gap:10px; flex-wrap:wrap;">
                <button id="btn-salvar-membro" class="btn-gold" style="width:auto;" onclick="salvarFormularioMembro()">Salvar Dados</button>
                <button id="btn-cancelar-membro" class="btn-gold" style="width:auto; display:none; background: #a0aec0;" onclick="cancelarEdicaoMembro()">Cancelar</button>
            </div>
        </div>
        <div class="table-wrapper">
            <table>
                <thead><tr><th>Nome</th><th>Matrícula</th><th>Semestre</th><th>Modalidade</th><th>Ações</th></tr></thead>
                <tbody id="tbody-membros-list"></tbody>
            </table>
        </div>
    </section>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyA2ef4mY9sm-cVPkAq0bwzBjsgmRLN2_jQ",
        authDomain: "portal-liga-de-cirurgia.firebaseapp.com",
        databaseURL: "https://portal-liga-de-cirurgia-default-rtdb.firebaseio.com",
        projectId: "portal-liga-de-cirurgia",
        messagingSenderId: "408679438531",
        appId: "1:408679438531:web:46667abc7bcdd9b9d2ea76"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let idAulaEditando = null;
    let idMembroEditando = null;

    function showSlide(id) {
        document.querySelectorAll('.slide-card').forEach(s => s.classList.remove('active'));
        document.getElementById('slide-' + id).classList.add('active');
        document.querySelectorAll('.nav-links button').forEach(b => b.classList.remove('active'));
        document.getElementById('nav-' + id).classList.add('active');
        if(id === 'freq') carregarDadosFrequencia();
        if(id === 'atas') carregarAtas();
        if(id === 'bib') carregarBiblioteca();
        if(id === 'plantoes') carregarPlantoes();
        if(id === 'adm') carregarMembrosAdmin();
    }

    function switchFreqView(view) {
        document.getElementById('freq-view-ranking').style.display = view === 'ranking' ? 'block' : 'none';
        document.getElementById('freq-view-dias').style.display = view === 'dias' ? 'block' : 'none';
    }

    auth.onAuthStateChanged(user => {
        const btn = document.getElementById('btn-login-main');
        const adminElements = document.querySelectorAll('.admin-only');
        const navAdm = document.getElementById('nav-adm');
        if(user) {
            btn.innerText = "Sair";
            navAdm.style.display = "block";
            adminElements.forEach(el => { if(el.closest('#membros') === null) el.style.display = "block"; });
            carregarDadosFrequencia();
        } else {
            btn.innerText = "Login Sec.";
            navAdm.style.display = "none";
            adminElements.forEach(el => el.style.display = "none");
            carregarDadosFrequencia();
        }
    });

    function toggleLogin() {
        if(auth.currentUser) auth.signOut();
        else {
            const email = prompt("E-mail Secretaria:");
            const pass = prompt("Senha:");
            if(email && pass) auth.signInWithEmailAndPassword(email, pass).catch(e => alert("Erro ao logar."));
        }
    }

    // --- FREQUÊNCIA ---
    async function carregarDadosFrequencia() {
        const rankingBody = document.getElementById('tbody-ranking');
        const diasContainer = document.getElementById('lista-dias-container');
        const inputChamada = document.getElementById('tbody-chamada-input');
        
        const membrosSnap = await db.collection("membros").orderBy("nome").get();
        const aulasSnap = await db.collection("aulas").orderBy("timestamp", "desc").get();

        inputChamada.innerHTML = '';
        membrosSnap.forEach(doc => {
            inputChamada.innerHTML += `<tr><td>${doc.data().nome}</td><td>
                <select class="status-input" data-id="${doc.id}">
                    <option value="P">Presente</option><option value="F">Falta</option><option value="J">Justif.</option>
                </select>
            </td></tr>`;
        });

        let ranking = [];
        membrosSnap.forEach(doc => {
            let p=0, j=0, f=0;
            aulasSnap.forEach(aDoc => {
                const a = aDoc.data();
                if(a.presentes?.includes(doc.id)) p++;
                else if(a.justificadas?.includes(doc.id)) j++;
                else f++;
            });
            ranking.push({id: doc.id, nome: doc.data().nome, p, j, f});
        });

        ranking.sort((a,b) => {
            if(b.p !== a.p) return b.p - a.p; 
            if(a.f !== b.f) return a.f - b.f; 
            return a.j - b.j;                
        });

        rankingBody.innerHTML = ranking.map(r => `
            <tr>
                <td><strong>${r.nome}</strong></td>
                <td><span class="badge bg-presenca">${r.p}</span></td>
                <td><span class="badge bg-justificada">${r.j}</span></td>
                <td><span class="badge bg-falta">${r.f}</span></td>
            </tr>`).join('');

        diasContainer.innerHTML = '';
        aulasSnap.forEach(doc => {
            const a = doc.data();
            const aulaId = doc.id;
            let botoes = auth.currentUser ? `<div style="display:flex; gap:5px;"><button class="btn-danger btn-small" style="background:var(--warning)" onclick="iniciarEdicaoAula('${aulaId}', '${a.tema}', '${a.data}', '${a.hora}')"><i class="fa-solid fa-pen"></i></button><button class="btn-danger btn-small" onclick="excluirAula('${aulaId}')"><i class="fa-solid fa-trash"></i></button></div>` : '';
            
            const pNomes = membrosSnap.docs.filter(m => a.presentes?.includes(m.id)).map(m => m.data().nome).join(', ') || 'Ninguém';
            const jNomes = membrosSnap.docs.filter(m => a.justificadas?.includes(m.id)).map(m => m.data().nome).join(', ') || 'Nenhuma';
            const fNomes = membrosSnap.docs.filter(m => !a.presentes?.includes(m.id) && !a.justificadas?.includes(m.id)).map(m => m.data().nome).join(', ') || 'Nenhuma';

            diasContainer.innerHTML += `
                <div class="day-item" id="aula-item-${aulaId}" data-pres='${JSON.stringify(a.presentes || [])}' data-just='${JSON.stringify(a.justificadas || [])}'>
                    <div class="day-header" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'block' ? 'none' : 'block'">
                        <span>📅 ${a.data || a.dataCadastro} ${a.hora || ''} - <strong>${a.tema}</strong></span>
                        <div style="display:flex; align-items:center; gap:10px;">${botoes} <i class="fa-solid fa-chevron-down"></i></div>
                    </div>
                    <div class="day-content">
                        <p style="color:var(--success); margin-top:0;"><strong>Presentes:</strong> ${pNomes}</p>
                        <p style="color:#744210"><strong>Justificadas:</strong> ${jNomes}</p>
                        <p style="color:var(--danger); margin-bottom:0;"><strong>Faltas:</strong> ${fNomes}</p>
                    </div>
                </div>`;
        });
    }

    async function salvarAula() {
        const tema = document.getElementById('aula-tema').value;
        const data = document.getElementById('aula-data').value;
        const hora = document.getElementById('aula-hora').value;
        if(!tema) return alert("Digite o tema!");
        
        const inputs = document.querySelectorAll('.status-input');
        let presentes = [], justificadas = [];
        inputs.forEach(i => {
            if(i.value === 'P') presentes.push(i.dataset.id);
            if(i.value === 'J') justificadas.push(i.dataset.id);
        });

        const dados = { tema, data, hora, presentes, justificadas, timestamp: firebase.firestore.FieldValue.serverTimestamp(), dataCadastro: new Date().toLocaleDateString() };

        if(idAulaEditando) await db.collection("aulas").doc(idAulaEditando).update({ tema, data, hora, presentes, justificadas });
        else await db.collection("aulas").add(dados);
        
        alert("Salvo!"); cancelarEdicaoAula(); carregarDadosFrequencia();
    }

    function iniciarEdicaoAula(id, tema, data, hora) {
        idAulaEditando = id;
        const div = document.getElementById(`aula-item-${id}`);
        const p = JSON.parse(div.dataset.pres);
        const j = JSON.parse(div.dataset.just);
        
        document.getElementById('aula-tema').value = tema;
        document.getElementById('aula-data').value = data !== 'undefined' ? data : '';
        document.getElementById('aula-hora').value = hora !== 'undefined' ? hora : '';
        document.getElementById('titulo-painel-chamada').innerText = "Editando Chamada";
        document.getElementById('btn-cancelar-edicao').style.display = "inline-block";
        document.getElementById('panel-chamada').classList.add('edit-mode-bg');

        document.querySelectorAll('.status-input').forEach(i => {
            if(p.includes(i.dataset.id)) i.value = 'P';
            else if(j.includes(i.dataset.id)) i.value = 'J';
            else i.value = 'F';
        });
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelarEdicaoAula() { 
        idAulaEditando = null; 
        document.getElementById('aula-tema').value = ""; 
        document.getElementById('aula-data').value = ""; 
        document.getElementById('aula-hora').value = ""; 
        document.getElementById('btn-cancelar-edicao').style.display = "none"; 
        document.getElementById('titulo-painel-chamada').innerText = "Registrar Chamada";
        document.getElementById('panel-chamada').classList.remove('edit-mode-bg');
    }

    async function excluirAula(id) { if(confirm("Excluir chamada?")) { await db.collection("aulas").doc(id).delete(); carregarDadosFrequencia(); } }

    // --- ATAS (VISUAL REFORMULADO) ---
    async function salvarAta() {
        const titulo = document.getElementById('ata-titulo').value;
        const data = document.getElementById('ata-data').value.split('-').reverse().join('/');
        const url = document.getElementById('ata-link').value;
        if(!titulo || !url) return alert("Erro!");
        await db.collection("atas").add({ titulo, url, data, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
        alert("Ata Salva!"); carregarAtas();
    }
    function carregarAtas() {
        db.collection("atas").orderBy("timestamp", "desc").get().then(snap => {
            document.getElementById('atas-list').innerHTML = snap.docs.map(doc => `
            <div class="material-item">
                <div class="material-info">
                    <strong>${doc.data().titulo}</strong>
                    <span style="font-size:0.8rem; color:#718096;"><i class="fa-regular fa-calendar"></i> ${doc.data().data}</span>
                </div>
                <div class="material-actions">
                    <a href="${doc.data().url}" target="_blank" class="btn-gold btn-small" style="text-decoration:none;"><i class="fa-solid fa-file-pdf"></i> Abrir PDF</a>
                    ${auth.currentUser ? `<button class="btn-danger btn-small" onclick="excluirDoc('atas','${doc.id}',carregarAtas)"><i class="fa-solid fa-trash"></i></button>` : ''}
                </div>
            </div>`).join('');
        });
    }

    // --- BIBLIOTECA (VISUAL REFORMULADO) ---
    async function salvarBib() {
        const titulo = document.getElementById('bib-titulo').value;
        const categoria = document.getElementById('bib-cat').value;
        const url = document.getElementById('bib-link').value;
        if(!titulo || !url) return;
        await db.collection("biblioteca").add({ titulo, categoria, url, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
        carregarBiblioteca();
    }
    function carregarBiblioteca() {
        db.collection("biblioteca").orderBy("timestamp", "desc").get().then(snap => {
            const groups = {};
            snap.forEach(doc => {
                const b = doc.data();
                if(!groups[b.categoria]) groups[b.categoria] = [];
                groups[b.categoria].push({id: doc.id, ...b});
            });
            document.getElementById('bib-list').innerHTML = Object.keys(groups).map(cat => `<div class="category-block"><h3>📁 ${cat}</h3>` + groups[cat].map(i => `
                <div class="material-item">
                    <div class="material-info">
                        <strong>${i.titulo}</strong>
                    </div>
                    <div class="material-actions">
                        <a href="${i.url}" target="_blank" class="btn-gold btn-small" style="text-decoration:none;"><i class="fa-solid fa-link"></i> Acessar</a>
                        ${auth.currentUser ? `<button class="btn-danger btn-small" onclick="excluirDoc('biblioteca','${i.id}',carregarBiblioteca)"><i class="fa-solid fa-trash"></i></button>` : ''}
                    </div>
                </div>`).join('') + `</div>`).join('');
        });
    }

    // --- PLANTÕES (VISUAL REFORMULADO) ---
    async function salvarPlantao() {
        const mSelect = document.getElementById('p-membro');
        const mes = document.getElementById('p-mes').value;
        const qtd = document.getElementById('p-qtd').value;
        await db.collection("plantoes").add({ membroNome: mSelect.options[mSelect.selectedIndex].text, mesReferencia: mes, quantidade: qtd, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
        carregarPlantoes();
    }
    function carregarPlantoes() {
        db.collection("membros").orderBy("nome").get().then(snap => {
            document.getElementById('p-membro').innerHTML = snap.docs.map(doc => `<option value="${doc.id}">${doc.data().nome}</option>`).join('');
        });
        db.collection("plantoes").orderBy("mesReferencia", "desc").get().then(snap => {
            document.getElementById('plantoes-list').innerHTML = snap.docs.map(doc => `
                <div class="material-item">
                    <div class="material-info">
                        <strong>${doc.data().membroNome}</strong>
                        <span style="font-size:0.8rem; color:#718096;">Mês Ref: ${doc.data().mesReferencia}</span>
                    </div>
                    <div class="material-actions">
                        <span class="badge" style="background:var(--primary); color:white; padding:6px 12px;">${doc.data().quantidade} Plantões</span>
                        ${auth.currentUser ? `<button class="btn-danger btn-small" onclick="excluirDoc('plantoes','${doc.id}',carregarPlantoes)"><i class="fa-solid fa-trash"></i></button>` : ''}
                    </div>
                </div>`).join('');
        });
    }

    // --- GESTÃO DE MEMBROS ---
    async function salvarFormularioMembro() {
        const nome = document.getElementById('m-nome').value, mat = document.getElementById('m-mat').value, sem = document.getElementById('m-sem').value, mod = document.getElementById('m-mod').value;
        if(idMembroEditando) await db.collection("membros").doc(idMembroEditando).update({ nome, matricula: mat, semestre: sem, modalidade: mod });
        else await db.collection("membros").add({ nome, matricula: mat, semestre: sem, modalidade: mod });
        cancelarEdicaoMembro(); carregarMembrosAdmin();
    }
    function iniciarEdicaoMembro(id, n, m, s, mo) { idMembroEditando = id; document.getElementById('m-nome').value = n; document.getElementById('m-mat').value = m; document.getElementById('m-sem').value = s; document.getElementById('m-mod').value = mo; document.getElementById('btn-cancelar-membro').style.display = "inline-block"; document.getElementById('panel-membro').classList.add('edit-mode-bg'); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    function cancelarEdicaoMembro() { idMembroEditando = null; document.getElementById('btn-cancelar-membro').style.display = "none"; document.getElementById('panel-membro').classList.remove('edit-mode-bg'); document.querySelectorAll('#panel-membro input').forEach(i => i.value = ""); }
    function carregarMembrosAdmin() {
        db.collection("membros").orderBy("nome").get().then(snap => {
            document.getElementById('tbody-membros-list').innerHTML = snap.docs.map(doc => {
                const m = doc.data();
                return `<tr><td>${m.nome}</td><td>${m.matricula}</td><td>${m.semestre}</td><td><span class="badge ${m.modalidade.includes('Só') ? 'bg-justificada' : 'bg-presenca'}">${m.modalidade}</span></td><td><button class="btn-danger btn-small" style="background:var(--warning);" onclick="iniciarEdicaoMembro('${doc.id}','${m.nome}','${m.matricula}','${m.semestre}','${m.modalidade}')"><i class="fa-solid fa-pen"></i></button><button class="btn-danger btn-small" onclick="excluirDoc('membros','${doc.id}',carregarMembrosAdmin)"><i class="fa-solid fa-trash"></i></button></td></tr>`;
            }).join('');
        });
    }

    async function excluirDoc(coll, id, callback) { if(confirm("Excluir permanentemente?")) { await db.collection(coll).doc(id).delete(); callback(); } }

    window.onload = () => showSlide('freq');
</script>
</body>
</html>
